name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clipmux
          POSTGRES_PASSWORD: clipmux
          POSTGRES_DB: clipmux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipmux -d clipmux_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://clipmux:clipmux@localhost:5432/clipmux_test?sslmode=disable
      # A missing ffmpeg or packager fails the media tests instead of skipping them.
      CLIPMUX_REQUIRE_MEDIA_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Media tools (ffmpeg, pinned Shaka Packager)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p "$RUNNER_TEMP/bin" && toolchain/install_packager.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/clipmux
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
  sqlc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generated queries are current
        run: make sqlc-check
  ts:
    # The dashboard and the @clipmux packages (D002).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  toolchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scripts parse
        run: bash -n toolchain/*.sh
      - name: Pinned Shaka Packager verifies
        run: mkdir -p "$RUNNER_TEMP/bin" && toolchain/install_packager.sh "$RUNNER_TEMP/bin"
  image:
    # The packaged stack: the image builds (FFmpeg from source, cached),
    # starts under compose behind Caddy, confines its tools, and passes the
    # setup test end to end. The image is never pushed (D005, D006).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: clipmux:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start app, Postgres and Caddy
        working-directory: deploy
        run: |
          printf 'POSTGRES_PASSWORD=ci\nCLIPMUX_SECRETS_KEY=v1:%s\nCLIPMUX_PUBLIC_URL=http://localhost\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --no-build --wait
      - name: The sandbox holds inside the container
        run: docker compose -f deploy/compose.yml exec -T app clipmux sandbox-exec --probe
      - name: A sandboxed tool can't open a socket
        run: |
          if docker compose -f deploy/compose.yml exec -T app clipmux sandbox-exec -- /usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'; then
            echo "a sandboxed tool connected to the API" >&2; exit 1
          fi
      - name: Setup test through Caddy
        run: docker compose -f deploy/compose.yml exec -T app clipmux admin setup-test --wait --timeout 15m
      - name: Health through Caddy
        run: curl -fsS http://localhost/healthz
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs
