# Every pull request and every push to main: the Go suite against Postgres,
# then the TypeScript packages and the site. The repository is public, so
# fork pull requests run here with a read-only token and no secrets. Media
# tests skip without ffmpeg and the packager; run them locally. The heavier
# suites (exit, Safari, providers, installers) run only by hand; see
# .github/CI.md.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clipmux
          POSTGRES_PASSWORD: clipmux
          POSTGRES_DB: clipmux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipmux -d clipmux_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://clipmux:clipmux@localhost:5432/clipmux_test?sslmode=disable
      CLIPMUX_SKIP_SPEECH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -timeout 15m ./...

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and test the packages, dashboard, Worker and site
        run: pnpm typecheck && pnpm test
      - name: Build the site and run its docs lints
        run: pnpm --filter @clipmux/site run build && pnpm --filter @clipmux/site run lint:docs
      - run: pnpm lint

  dockerfile:
    # The Dockerfile's own lints (docker build --check): seconds, where
    # building the image takes up to an hour (image.yml, by hand).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build --check .

  snippets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: site/snippets/go/go.mod
      - name: The docs' Python, Go and PHP snippets against the vector files
        run: site/snippets/test.sh
