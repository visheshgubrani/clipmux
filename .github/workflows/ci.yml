# Every pull request: Go (vet and race tests against Postgres and SeaweedFS,
# with ffmpeg and the packager) and one job of quick checks. Real whisper.cpp
# runs on the self-hosted GPU runner (gpu.yml), not here. The image, the exit
# suites, Safari and the agent tarballs run by hand and on release tags; see
# .github/README.md for what runs where and why (Actions minutes).
name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clipmux
          POSTGRES_PASSWORD: clipmux
          POSTGRES_DB: clipmux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipmux -d clipmux_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://clipmux:clipmux@localhost:5432/clipmux_test?sslmode=disable
      # A missing ffmpeg or packager fails the media tests instead of skipping them.
      CLIPMUX_REQUIRE_MEDIA_TOOLS: "1"
      # whisper.cpp's tests run on the GPU runner, on its own CPU and GPU.
      CLIPMUX_SKIP_SPEECH: "1"
      # The storage contract suite runs against SeaweedFS too, never skipping.
      CLIPMUX_REQUIRE_S3: "1"
      CLIPMUX_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      CLIPMUX_TEST_S3_ACCESS_KEY: clipmuxdev
      CLIPMUX_TEST_S3_SECRET_KEY: clipmuxdevsecret0123456789
    steps:
      - uses: actions/checkout@v4
      - name: S3-compatible store (SeaweedFS, pinned in deploy/compose.dev.yml)
        # Services can't take a command, so start it here.
        run: |
          docker compose -f deploy/compose.dev.yml up -d seaweedfs
          for i in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && exit 0; sleep 1; done; exit 1
      - uses: ./.github/actions/media-tools
      # gofmt and vet run in checks (make lint).
      - run: go test -race -timeout 20m ./...
      - run: go build ./cmd/clipmux
  checks:
    # Each job is billed by the started minute, so the quick checks share one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Go lint (gofmt, vet, staticcheck, govulncheck)
        run: make lint
      - name: Generated queries are current
        run: make sqlc-check
      - name: Toolchain scripts parse, and the pinned packager verifies
        run: bash -n toolchain/*.sh && mkdir -p "$RUNNER_TEMP/bin" && toolchain/install_packager.sh "$RUNNER_TEMP/bin"
      - name: TypeScript (the dashboard, the @clipmux packages and the Worker, D002)
        run: pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: The embedded Worker bundle is current
        run: |
          cp worker/dist/worker.js internal/cloudflare/worker.js
          git diff --exit-code internal/cloudflare/worker.js
