# The self-contained Linux agent (D061): clipmux with its own FFmpeg,
# libraries, VAAPI drivers and packager, built natively for amd64 and arm64,
# checked in a clean container with no FFmpeg of its own, and kept as a
# workflow artifact. On a v* tag release.yml calls it and puts the tarballs
# on the GitHub Release (P6-T07).
name: Agent tarball
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tarball:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # A cold FFmpeg build on arm64 takes most of this.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          outputs: type=local,dest=dist
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          # The image job's registry cache (D142) holds the tool stages the
          # tarball packs; this job only reads it.
          cache-from: type=registry,ref=ghcr.io/visheshgubrani/clipmux-buildcache:${{ matrix.arch }}
      - name: Works in a clean Ubuntu 24.04
        run: toolchain/check_agent.sh dist/clipmux-agent-linux-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: clipmux-agent-linux-${{ runner.arch }}
          path: dist/
          retention-days: 30
