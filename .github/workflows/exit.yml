# The exit tests of Phases 1 to 5 (docs/plans/P1-T09-T12.md, T12, and each
# phase's plan): the real binary, Chromium (hls.js, the Video.js player,
# subtitles and chapters, the uploader, the dashboard) and ExoPlayer on an
# Android emulator, with its subtitles (P6-T03). Safari runs in exit-safari.yml. A run by hand may soak
# for 30 minutes (P5 check 5); every other run soaks for 60 s.
name: Exit test
on:
  # About an hour of Linux runner and a quarter of one for the emulator, so
  # only by hand: before merging a phase, anything touching playback, or a release.
  workflow_dispatch:
    inputs:
      soak:
        description: Soak for 30 minutes instead of 60 s (P5 check 5)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: exit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  TEST_DATABASE_URL: postgres://clipmux:clipmux@localhost:5432/clipmux_test?sslmode=disable
  CLIPMUX_REQUIRE_MEDIA_TOOLS: "1"
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clipmux
          POSTGRES_PASSWORD: clipmux
          POSTGRES_DB: clipmux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipmux -d clipmux_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ./.github/actions/media-tools
      - run: pnpm install --frozen-lockfile && pnpm -r run build
      - name: S3-compatible store (R2 in the Phase 2 exit test)
        run: |
          docker compose -f deploy/compose.dev.yml up -d seaweedfs
          for i in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && exit 0; sleep 1; done; exit 1
      - name: promtool (P5 check 6)
        run: |
          docker create --name prom prom/prometheus:v3.5.0
          docker cp prom:/bin/promtool /usr/local/bin/promtool
          docker rm prom
          promtool check rules deploy/prometheus/alerts.yml
      - name: Real binary (Phase 1 to 5 exit tests)
        env:
          CLIPMUX_E2E_SOAK: ${{ inputs.soak && '1' || '' }}
          CLIPMUX_REQUIRE_S3: "1"
          CLIPMUX_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          CLIPMUX_TEST_S3_ACCESS_KEY: clipmuxdev
          CLIPMUX_TEST_S3_SECRET_KEY: clipmuxdevsecret0123456789
        run: CLIPMUX_E2E=1 go test ./internal/e2e -count=1 -timeout 90m -v
      - name: Chromium suites
        working-directory: e2e/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:browser
      - name: Launch exit check 8 (examples/nextjs-lms, P6-T28)
        working-directory: e2e/web
        run: pnpm run test:exit8
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: e2e/web/test-results/

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clipmux
          POSTGRES_PASSWORD: clipmux
          POSTGRES_DB: clipmux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipmux -d clipmux_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: ./.github/actions/media-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start the fixture
        run: |
          CLIPMUX_E2E=1 CLIPMUX_E2E_FIXTURE=1 CLIPMUX_E2E_SERVE_PORT=18080 CLIPMUX_E2E_PAGES=/nonexistent \
            go test ./internal/e2e -run TestPlayerFixture -count=1 -timeout 60m -v > fixture.log 2>&1 &
          for i in $(seq 300); do curl -sf http://127.0.0.1:8099/config && exit 0; sleep 2; done
          cat fixture.log; exit 1
      - name: Free disk space for the emulator
        # The API 35 image needs ~7.2 GB for userdata; the runner had 6.7 GB free.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: ExoPlayer on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disk-size: 4096M
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: e2e/android
          script: |
            adb reverse tcp:8099 tcp:8099
            adb reverse tcp:18080 tcp:18080
            gradle connectedDebugAndroidTest --no-daemon
      - name: Fixture logs
        if: failure()
        run: cat fixture.log
