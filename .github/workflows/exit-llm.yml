# The Phase 5 exit test's real-account checks (docs/plans/P5-production.md,
# checks 18 and 20): 11 s of English transcribed by OpenAI's speech API,
# then chapters made by Claude and by OpenAI's chat API, each through
# Connect, on the real binary (TestExitRealLLMAndSpeech). It pays for a few
# cents of API calls, so it runs on main, weekly and by hand, and does
# nothing without the keys.
name: Exit test (LLM and speech)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: read
concurrency:
  group: exit-llm
  cancel-in-progress: false
env:
  TEST_DATABASE_URL: postgres://clipmux:clipmux@localhost:5432/clipmux_test?sslmode=disable
  CLIPMUX_REQUIRE_MEDIA_TOOLS: "1"
jobs:
  # A missing secret skips the run, shown as skipped rather than passed.
  secrets:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - id: check
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY is not set; skipping"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
  llm:
    needs: secrets
    if: needs.secrets.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clipmux
          POSTGRES_PASSWORD: clipmux
          POSTGRES_DB: clipmux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipmux -d clipmux_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/media-tools
      - name: Real accounts
        run: CLIPMUX_E2E=1 CLIPMUX_E2E_LLM=1 go test ./internal/e2e -run TestExitRealLLMAndSpeech -count=1 -timeout 40m -v
