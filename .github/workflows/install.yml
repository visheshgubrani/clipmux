# The one-line installers (P6-T08) on a clean runner: two release
# candidates of this commit are built and pushed to a registry on the
# runner, and toolchain/check_install.sh installs the first with
# deploy/install.sh, passes the setup test through Caddy, pairs an agent with
# deploy/install-agent.sh as a system service, upgrades to the second
# candidate keeping the data and the owner's session, and uninstalls. It
# builds the image and the agent tarball (cached), so it runs by hand.
name: Install
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      registry:
        image: registry:3
        ports: ["5000:5000"]
    env:
      REPO: localhost:5000/clipmux
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Release candidate 1
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REPO }}:v0.0.0-ci.1
          build-args: VERSION=v0.0.0-ci.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release candidate 2 (only the binary differs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REPO }}:v0.0.0-ci.2
          build-args: VERSION=v0.0.0-ci.2
          cache-from: type=gha
      - name: Agent tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          outputs: type=local,dest=dist
          build-args: VERSION=v0.0.0-ci.1
          cache-from: |
            type=gha
            type=gha,scope=agent-${{ runner.arch }}
      - name: Install, pair, upgrade, uninstall
        # As root, as `curl … | sudo sh` runs: the agent becomes a system unit.
        run: sudo --preserve-env=PATH bash toolchain/check_install.sh "$REPO:v0.0.0-ci.1" "$REPO:v0.0.0-ci.2" dist/clipmux-agent-linux-amd64.tar.gz
