# The packaged stack under compose (the image job that was in ci.yml). It
# builds FFmpeg and whisper.cpp from source on a cache miss, so it runs by
# hand, and from release.yml on a v* tag (P6-T07).
name: Image
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    # The packaged stack: the image builds (FFmpeg from source, cached),
    # starts under compose behind Caddy, confines its tools, and passes the
    # setup test end to end, on amd64 and on arm64. Run by hand on main,
    # each architecture that passed is pushed by digest, and the manifest
    # job joins them as sha-{commit}: serverless providers pull its amd64
    # half (D052, D058), arm64 servers the other (D114). On a v* tag
    # (release.yml) the image is built with VERSION set to the tag and
    # pushed as the tag, plus :latest unless it is a prerelease (P6-T07).
    # Each push gets a build provenance attestation. It is never pushed as
    # /server or /web (D006), and never from a pull request.
    #
    # The build cache is a registry cache, one per architecture, in its own
    # package (D142): it has no size cap and doesn't expire, so a release
    # finds every unchanged layer and reuses its bytes, and a host that ran
    # the last release downloads only what changed. Main and tags write it;
    # a run on another branch only reads it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # A cold FFmpeg build on arm64, or FFmpeg plus whisper's CUDA backend
    # on amd64 (D131), takes most of this.
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REPO: ghcr.io/visheshgubrani/clipmux
      IMAGE: ghcr.io/visheshgubrani/clipmux:${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      CACHE: ghcr.io/visheshgubrani/clipmux-buildcache:${{ matrix.arch }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The layer report compares with the last release's image.
          fetch-depth: 0
      # The amd64 image carries whisper's CUDA backend (D131): FFmpeg, the
      # CUDA toolkit while it builds, and the image itself outgrew the
      # runner's free disk. Its preinstalled SDKs aren't used here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: clipmux:local
          # The binary names the image it ships in, so providers run this
          # same build.
          build-args: |
            VERSION=${{ env.VERSION }}
            WORKER_IMAGE=${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.CACHE) || '' }}
      - name: Start app, Postgres and Caddy
        working-directory: deploy
        run: |
          printf 'POSTGRES_PASSWORD=ci\nCLIPMUX_SECRETS_KEY=v1:%s\nCLIPMUX_PUBLIC_URL=http://localhost\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --no-build --wait
      - name: The sandbox holds inside the container
        run: docker compose -f deploy/compose.yml exec -T app clipmux sandbox-exec --probe
      - name: A sandboxed tool can't open a socket
        run: |
          if docker compose -f deploy/compose.yml exec -T app clipmux sandbox-exec -- /usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'; then
            echo "a sandboxed tool connected to the API" >&2; exit 1
          fi
      - name: Setup test through Caddy
        run: docker compose -f deploy/compose.yml exec -T app clipmux admin setup-test --wait --timeout 15m
      - name: Health through Caddy
        run: curl -fsS http://localhost/healthz
      - name: Metrics stay on the compose network
        run: |
          if curl -fsS --max-time 3 http://localhost:9090/metrics; then
            echo "the metrics port is published" >&2; exit 1
          fi
          docker compose -f deploy/compose.yml exec -T caddy wget -qO- http://app:9090/metrics | grep -q '^clipmux_build_info{'
          if curl -fsS http://localhost/metrics | grep -q clipmux_; then
            echo "metrics are served through Caddy" >&2; exit 1
          fi
      - name: The licences and the source offer ship in the image (D086)
        run: |
          docker run --rm --entrypoint bash clipmux:local -c 'cd /usr/share/doc/clipmux/licenses &&
            for f in clipmux/LICENSE SOURCE.md ffmpeg/COPYING.GPLv2 ffmpeg/toolchain.json whisper/LICENSE models/NOTICE packages.txt; do
              [ -s "$f" ] || { echo "no $f in the image" >&2; exit 1; }; done'
      - name: The speech models are baked in and match their pins (D118)
        run: |
          docker run --rm -i --read-only --entrypoint bash clipmux:local -c '
            . /dev/stdin; cd "$CLIPMUX_BAKED_MODELS_DIR" &&
            echo "$WHISPER_MODEL_SHA256  $(basename "$WHISPER_MODEL_URL")" | sha256sum -c - &&
            echo "$WHISPER_VAD_MODEL_SHA256  $(basename "$WHISPER_VAD_MODEL_URL")" | sha256sum -c -' <toolchain/versions.env
      - name: The binary names its own image and prints its version
        run: |
          docker run --rm --entrypoint grep clipmux:local -aqF "$IMAGE" /usr/local/bin/clipmux
          test "$(docker run --rm --entrypoint clipmux clipmux:local version)" = "$VERSION"
      - name: A stop drains within the grace period
        run: |
          start=$(date +%s)
          docker compose -f deploy/compose.yml stop app
          took=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose -f deploy/compose.yml ps -aq app)")
          echo "stopped in ${took}s with exit code ${code}"
          [ "$code" = 0 ] && [ "$took" -lt 40 ]
      # After every test, and from BuildKit rather than the daemon: the same
      # inputs, so every step is a cache hit, and the layers go up as the
      # blobs BuildKit made (the base as Ubuntu's own), never re-compressed.
      # By digest only: the manifest job tags the joined index.
      - name: Push this architecture (main or a tag)
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ env.VERSION }}
            WORKER_IMAGE=${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true
      - name: Attest this architecture's build
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Hand the digest to the manifest job
        if: steps.push.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: steps.push.outcome == 'success'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      # What a host that ran the last release downloads for this one. With
      # no change to the Dockerfile or toolchain/ since that release, only
      # the binary's layer should be new; anything else is flagged, without
      # holding the release (a lost cache would rebuild the layers).
      - name: Layers against the last release
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          [ -n "$prev" ] || { echo "no earlier release to compare with"; exit 0; }
          if git diff --quiet "$prev" HEAD -- Dockerfile .dockerignore toolchain/; then
            toolchain/check_layers.sh --strict --platform "linux/${{ matrix.arch }}" "$REPO:$prev" "$REPO@$DIGEST" \
              || echo "::warning::layers below the binary are new since $prev (or its image couldn't be read), though the Dockerfile and toolchain/ didn't change: hosts download them again"
          else
            toolchain/check_layers.sh --platform "linux/${{ matrix.arch }}" "$REPO:$prev" "$REPO@$DIGEST"
          fi
      - name: Logs
        if: failure()
        # No deploy/.env means the stack never started (e.g. the build failed).
        run: '[ -f deploy/.env ] || exit 0; docker compose -f deploy/compose.yml logs'
  manifest:
    # One reference names both architectures, so it runs on Modal and RunPod
    # (amd64) and on an arm64 server; Docker picks the right half.
    needs: image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REPO: ghcr.io/visheshgubrani/clipmux
      IMAGE: ghcr.io/visheshgubrani/clipmux:${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
      TAG: ${{ github.ref_name }}
      IS_TAG: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release is also sha-{commit}, which exit-providers.yml pulls.
      - name: Join amd64 and arm64 (and move :latest for a release that isn't a prerelease)
        id: join
        working-directory: ${{ runner.temp }}/digests
        run: |
          [ "$(ls | wc -l)" = 2 ] || { echo "expected an amd64 and an arm64 digest, got: $(ls)" >&2; exit 1; }
          tags="-t $IMAGE"
          if [ "$IS_TAG" = true ]; then
            tags="$tags -t $REPO:sha-$GITHUB_SHA"
            case $TAG in *-*) ;; *) tags="$tags -t $REPO:latest" ;; esac
          fi
          # shellcheck disable=SC2046,SC2086 # $tags is -t flags; one source per digest file.
          docker buildx imagetools create $tags $(printf "$REPO@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE" | tee /dev/stderr | grep -q 'linux/arm64'
          echo "digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - name: Attest the multi-platform image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true
