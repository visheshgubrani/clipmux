schema_version: "1.1"
name: lms-upload-webhook-playback
expected_outcome: |
  Starting from skills/evals/lms-starter, the agent installs @clipmux/node,
  @clipmux/uploader and @clipmux/player, runs `npx @clipmux/node init`
  against the given server and gets it approved, adds one route handler
  (clipmuxHandler) serving upload, playback and webhook with the access rules
  from lib/users.ts, stores each lesson's asset and playback ID from the
  webhook by passthrough, and puts <clipmux-uploader> (instructor only) and
  <clipmux-player session-url> on the lesson page. `npm run build` passes and
  `doctor` ends with "✓ Ready.". No CLIPMUX_* secret appears in client code,
  the browser bundle or the agent's output. The exit-7 check
  (e2e/web/exit7) passes against the result: upload, ready by webhook,
  playback by an enrolled student, no media for a visitor.
context:
  scaffold_script: place-files.sh
