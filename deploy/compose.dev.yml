# Development Postgres and an S3-compatible store (SeaweedFS, for the S3
# adapter's contract tests). Production compose is deploy/compose.yml.
name: clipmux-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: clipmux
      POSTGRES_PASSWORD: clipmux
      POSTGRES_DB: clipmux
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipmux -d clipmux"]
      interval: 2s
      timeout: 3s
      retries: 30
  # Dev-only credentials; the identity file is not a secret.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=64 -volume.max=0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./seaweedfs-dev.json:/etc/seaweedfs/s3.json:ro
      - s3data:/data
volumes:
  pgdata:
  s3data:
