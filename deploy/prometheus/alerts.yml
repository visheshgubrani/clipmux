# Alerts for one ClipMux install (https://clipmux.com/docs/self-host/operate/monitoring).
# Check with: promtool check rules deploy/prometheus/alerts.yml
groups:
  - name: clipmux
    rules:
      - alert: ClipMuxDown
        expr: up{job="clipmux"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "serve isn't answering its metrics listener"

      - alert: ClipMuxNoLeader
        expr: max(clipmux_leader) == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "no serve replica runs the background loops: routes, webhooks and sweeps have stopped"

      - alert: ClipMuxServerErrors
        expr: sum(rate(clipmux_http_requests_total{code=~"5.."}[5m])) / sum(rate(clipmux_http_requests_total[5m])) > 0.02
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "more than 2% of requests answer 5xx; find them in the logs by request_id"

      - alert: ClipMuxLoopFailing
        expr: increase(clipmux_sweeper_errors_total[30m]) > 3
        labels: { severity: warn }
        annotations:
          summary: "background loop {{ $labels.sweeper }} keeps failing"

      - alert: ClipMuxLoopPanics
        expr: increase(clipmux_sweeper_panics_total[1h]) > 0
        labels: { severity: warn }
        annotations:
          summary: "background loop {{ $labels.sweeper }} panicked; the stack is in the logs"

      - alert: ClipMuxOutboxStuck
        expr: max by (kind) (clipmux_outbox_oldest_pending_seconds{kind!="webhook"}) > 3600
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.kind }} rows have been pending over an hour: run clipmux admin outbox"

      - alert: ClipMuxQueueBacklog
        expr: max by (kind) (clipmux_job_queue_oldest_seconds) > 1800
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "a {{ $labels.kind }} job has waited over 30 minutes: is a worker online?"

      - alert: ClipMuxNoWorkers
        expr: sum(clipmux_workers_online) == 0 and sum(clipmux_jobs{status="queued"}) > 0
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "jobs are queued and no worker has been seen in the last minute"

      - alert: ClipMuxWebhooksFailing
        expr: increase(clipmux_webhook_deliveries{status="failed"}[1h]) > 0
        labels: { severity: warn }
        annotations:
          summary: "webhook deliveries gave up after 24 hours; redeliver them from the dashboard or the API"

      - alert: ClipMuxPoolSaturated
        expr: clipmux_db_pool_acquired_conns / clipmux_db_pool_max_conns > 0.9
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "the Postgres pool is nearly full; raise pool_max_conns in DATABASE_URL"

      - alert: ClipMuxBackupStale
        expr: clipmux_backup_interval_seconds > 0 and time() - clipmux_backup_last_success_timestamp_seconds > 2 * clipmux_backup_interval_seconds
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "no backup has been written for twice the backup interval, or ever; see the dashboard's Backups card or `clipmux admin backup check`"

      - alert: ClipMuxBackupVerifyFailing
        expr: |
          clipmux_backup_verify_failed == 1
          or (clipmux_backup_interval_seconds > 0 and clipmux_backup_last_success_timestamp_seconds > 0
              and time() - clipmux_backup_last_verified_timestamp_seconds > 8 * 86400)
        for: 1h
        labels: { severity: warn }
        annotations:
          summary: "the newest backup failed its restore check, or none has passed one in 8 days; run `clipmux admin backup verify` for the reason"

      - alert: ClipMuxRestoreFenced
        expr: clipmux_restore_fenced == 1
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "the restore fence is up and storage deletes are stopped; read `clipmux admin restore report`, then `clipmux admin restore finish --yes`"

      - alert: ClipMuxDiskLow
        expr: clipmux_data_total_bytes > 0 and clipmux_data_free_bytes / clipmux_data_total_bytes < 0.10
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "under 10% of the disk holding the data directory is free; encodes, backups and restores need room"

  # What the install promises, as series to chart and to alert on burn rates.
  - name: clipmux-slo
    interval: 1m
    rules:
      - record: clipmux:http_availability:ratio_rate5m
        expr: 1 - sum(rate(clipmux_http_requests_total{code=~"5.."}[5m])) / sum(rate(clipmux_http_requests_total[5m]))
      - record: clipmux:http_availability:ratio_rate1h
        expr: 1 - sum(rate(clipmux_http_requests_total{code=~"5.."}[1h])) / sum(rate(clipmux_http_requests_total[1h]))
      - record: clipmux:http_request_duration_seconds:p95_rate5m
        expr: histogram_quantile(0.95, sum by (le) (rate(clipmux_http_request_duration_seconds_bucket[5m])))
      - record: clipmux:http_request_duration_seconds:p95_rate1h
        expr: histogram_quantile(0.95, sum by (le) (rate(clipmux_http_request_duration_seconds_bucket[1h])))
